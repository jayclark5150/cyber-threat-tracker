<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#0b0b14"/>
  <meta name="description" content="Cyber Threat Intelligence RSS Tracker"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Threat Feed"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"/>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
  <title>Cyber Threat Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>

<!-- Header -->
<header id="header">
  <div class="hdr-left">
    <svg class="logo-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M12 8v4l2 2"/></svg>
    <span class="app-title">Threat Intelligence</span>
    <span id="item-count" class="item-count"></span>
    <span class="version-badge">v0.0.1</span>
  </div>
  <div class="hdr-right">
    <span id="last-updated" class="last-updated"></span>
    <button id="theme-btn" class="hdr-btn" title="Toggle light/dark mode">
      <!-- Moon shown in dark mode, Sun shown in light mode -->
      <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun"  width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
    <button id="export-btn" class="hdr-btn" title="Export OPML">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </button>
    <button id="refresh-btn" class="hdr-btn" title="Refresh feeds">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    </button>
    <button id="settings-btn" class="hdr-btn" title="Feed settings">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</header>

<!-- Source filter bar -->
<div id="filter-bar">
  <button class="filter-chip active" data-source="all">All Sources</button>
</div>

<!-- Threat type tag bar -->
<div id="tag-bar">
  <button class="tag-chip active" data-tag="all">All Threats</button>
  <button class="tag-chip" data-tag="Ransomware">Ransomware</button>
  <button class="tag-chip" data-tag="Vulnerability">Vulnerability</button>
  <button class="tag-chip" data-tag="APT">APT</button>
  <button class="tag-chip" data-tag="Phishing">Phishing</button>
  <button class="tag-chip" data-tag="Malware">Malware</button>
  <button class="tag-chip" data-tag="Data Breach">Data Breach</button>
  <button class="tag-chip" data-tag="Critical Infra">Critical Infra</button>
</div>

<!-- Main layout -->
<div id="main">

  <!-- Left: feed list -->
  <div id="left-panel">
    <div id="feed-search-bar">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="feed-search" type="search" placeholder="Search stories…" autocomplete="off" spellcheck="false"/>
    </div>
    <div id="feed-list">
      <div id="feed-loading" class="loading-state">
        <div class="spinner"></div>
        <span>Fetching threat feeds…</span>
      </div>
      <div id="feed-items"></div>
    </div>
  </div>

  <!-- Vertical resize divider -->
  <div id="vertical-divider"></div>

  <!-- Right: article + chart -->
  <div id="right-panel">

    <!-- Article view -->
    <div id="article-view">
      <button id="mobile-back" aria-label="Back to stories">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        Stories
      </button>
      <div id="article-empty" class="empty-state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <p>Select a story to read</p>
        <span>Monitoring threat intelligence sources</span>
      </div>
      <div id="article-content" hidden>
        <div id="article-source-header" class="article-source-header">
          <div id="article-avatar" class="source-avatar"></div>
          <div class="article-source-meta">
            <span id="article-source-name" class="article-source-name"></span>
            <span id="article-date" class="article-date"></span>
          </div>
          <span id="article-priority-badge" class="priority-badge"></span>
        </div>
        <h2 id="article-title"></h2>
        <div id="article-tags-row" class="article-tags-row"></div>
        <div id="ai-summary-box" class="ai-summary-box hidden">
          <div class="ai-summary-label">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 6v6l4 2"/></svg>
            AI Summary
          </div>
          <p id="ai-summary-text"></p>
        </div>
        <p id="article-desc"></p>
        <div class="article-actions">
          <a id="article-link" href="#" target="_blank" rel="noopener noreferrer" class="read-btn">
            Read Full Story
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          </a>
          <span id="reading-time" class="reading-time"></span>
        </div>
      </div>
    </div>

    <!-- Horizontal resize divider -->
    <div id="right-divider"></div>

    <!-- Chart panel -->
    <div id="chart-panel">
      <div class="chart-toolbar">
        <span class="chart-label">Threat Activity</span>
        <div class="chart-toggle">
          <button class="chart-tab" data-chart="pie">By Source</button>
          <button class="chart-tab active" data-chart="type">By Threat</button>
          <button class="chart-tab" data-chart="line">Over Time</button>
        </div>
      </div>
      <div class="chart-wrap">
        <canvas id="threat-chart"></canvas>
      </div>
    </div>

  </div>
</div>

<!-- Settings modal -->
<div id="settings-overlay" class="overlay hidden">
  <div id="settings-modal" class="modal">
    <div class="modal-header">
      <h3>Feed Sources</h3>
      <button id="settings-close" class="modal-close">✕</button>
    </div>
    <div id="feed-source-list"></div>

    <!-- Add custom feed -->
    <div class="add-feed-section">
      <div class="add-feed-header">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Custom Feed
      </div>
      <div class="add-feed-form">
        <input id="new-feed-name" type="text"  placeholder="Feed name (e.g. Talos Blog)" autocomplete="off" spellcheck="false"/>
        <input id="new-feed-url"  type="url"   placeholder="RSS feed URL (https://…)" autocomplete="off" spellcheck="false"/>
        <button id="add-feed-btn" class="btn-add-feed">Test &amp; Add</button>
      </div>
    </div>

    <div class="modal-footer">
      <button id="save-settings-btn" class="btn-primary">Save &amp; Refresh</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
