name: Feed suggestion
description: Suggest a source to add to the built-in feed list
title: "Feed suggestion: "
labels: ["feed-suggestion"]
body:
  - type: markdown
    attributes:
      value: |
        Built-in feeds are collected every 15 minutes and shown to everyone.
        Good candidates publish threat intelligence, advisories or security news regularly.
  - type: input
    id: feed-name
    attributes:
      label: Feed name
      placeholder: e.g. Talos Intelligence Blog
    validations:
      required: true
  - type: input
    id: feed-url
    attributes:
      label: RSS or Atom feed URL
      placeholder: https://example.com/feed/
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Government
        - News
        - Threat Intel
        - Vulnerability Research
        - Ransomware
        - Other
  - type: textarea
    id: why
    attributes:
      label: Why add it?
      placeholder: What does it cover that the current sources don't?
